name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python 3.13 checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Build legacy policy redirects
        run: python scripts/build_pages.py

      - name: Run tests
        run: python -m pytest

      - name: Compile source
        run: python -m compileall src

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Build deployment image
        run: docker build --tag owkr-gather-bot:ci .

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          mkdir -p data
          docker compose config --quiet

      - name: Check image imports
        run: docker run --rm owkr-gather-bot:ci python -c 'import src.main; import src.e2e_preflight; import sqlite3'
